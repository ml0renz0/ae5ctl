name: CI — GNOME Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ae5ctl-gnome-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} (legacy regression)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install regression tools
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run Python regression tests
        run: python -m pytest

  gnome:
    name: GNOME Shell 46 ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every GJS module
        shell: bash
        run: |
          set -euo pipefail
          for file in gnome/ae5ctl@ml0renz0.github.io/*.js gnome/ae5ctl@ml0renz0.github.io/*.mjs; do
            node --input-type=module --check < "$file"
          done
      - name: Test ALSA parser without hardware
        run: node --test tests/gnome/*.test.mjs
      - name: Build and inspect extension ZIP
        shell: bash
        run: |
          python3 tools/build_extension.py
          unzip -t dist/ae5ctl@ml0renz0.github.io.shell-extension.zip
      - name: Upload GNOME ZIP only on request (one-day retention)
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'build-gnome')
        uses: actions/upload-artifact@v4
        with:
          name: ae5ctl-gnome-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/ae5ctl@ml0renz0.github.io.shell-extension.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  required:
    name: CI required
    if: always()
    needs: [python, gnome]
    runs-on: ubuntu-latest
    steps:
      - name: Require both test suites
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          GNOME_RESULT: ${{ needs.gnome.result }}
        run: |
          set -euo pipefail
          [[ "$PYTHON_RESULT" == success && "$GNOME_RESULT" == success ]]

  publish:
    name: Publish GNOME extension
    needs: [required]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tagged commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build extension and checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_extension.py
          (cd dist && sha256sum *.shell-extension.zip > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          unzip -t dist/*.shell-extension.zip
      - name: Publish the tagged ZIP to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ae5ctl GNOME $GITHUB_REF_NAME" \
            --notes "GNOME Shell 46 extension (ZIP)." \
            --prerelease --latest=false \
            dist/*.shell-extension.zip dist/SHA256SUMS
