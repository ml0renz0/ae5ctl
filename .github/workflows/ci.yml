name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Require an unreleased version for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          version=$(python -c 'import ae5ctl; print(ae5ctl.__version__)')
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            echo "Version ${version} is already tagged; increment the version before merging."
            exit 1
          fi
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=ae5ctl --cov-report=term-missing
      - run: python -m build
      - run: python packaging/build_deb.py
      - name: Smoke test Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --extract dist/*.deb /tmp/ae5ctl-deb
          PYTHONPATH=/tmp/ae5ctl-deb/usr/lib/python3/dist-packages /tmp/ae5ctl-deb/usr/bin/ae5ctl --version
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
