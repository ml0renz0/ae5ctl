name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: |
          python -m ruff format --diff .
          python -m ruff format --check .
      - name: Test without audio hardware or desktop
        run: python -m pytest

  deb:
    name: Debian package (opt-in)
    needs: tests
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'build-deb')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install packaging test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Run package-only tests
        run: python -m pytest -m package
      - name: Build Debian archive and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 packaging/build_deb.py --revision 1
          (cd dist && sha256sum -c ./*.deb.sha256)
      - name: Test install and removal on both Ubuntu versions
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.deb)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "::group::Smoke $image"
            docker run --rm \
              --mount "type=bind,src=$PWD/dist,dst=/packages,readonly" \
              --mount "type=bind,src=$PWD/packaging/smoke_deb.sh,dst=/smoke_deb.sh,readonly" \
              "$image" sh -ec \
              'set -- /packages/*.deb; test "$#" -eq 1; sh /smoke_deb.sh "$1"'
            echo "::endgroup::"
          done

      - name: Upload explicitly requested PR package (24-hour retention)
        uses: actions/upload-artifact@v4
        with:
          name: ae5ctl-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  required:
    name: CI required
    needs: [tests, deb]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate code and optional Debian checks
        shell: bash
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          DEB_RESULT: ${{ needs.deb.result }}
          BUILD_DEB: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-deb') }}
        run: |
          set -euo pipefail
          if [[ "$TESTS_RESULT" != success ]]; then
            echo "Python tests failed or did not run: $TESTS_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_DEB" == true ]]; then
            if [[ "$DEB_RESULT" != success ]]; then
              echo "Requested Debian packaging did not pass: $DEB_RESULT" >&2
              exit 1
            fi
          elif [[ "$DEB_RESULT" != skipped ]]; then
            echo "Unrequested Debian packaging unexpectedly ran: $DEB_RESULT" >&2
            exit 1
          fi

  publish:
    name: Sign and publish tagged release
    needs: [required]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate version tag and its ancestry on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match the pyproject.toml version: v$version" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release tags must point to commits already on main.' >&2
            exit 1
          fi
      - name: Install packaging test dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Run package-only tests
        run: python -m pytest -m package
      - name: Build and verify the tagged Debian package
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 packaging/build_deb.py --revision 1
          (cd dist && sha256sum -c ./*.deb.sha256)
      - name: Test install and removal on both Ubuntu versions
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.deb)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "::group::Smoke $image"
            docker run --rm \
              --mount "type=bind,src=$PWD/dist,dst=/packages,readonly" \
              --mount "type=bind,src=$PWD/packaging/smoke_deb.sh,dst=/smoke_deb.sh,readonly" \
              "$image" sh -ec \
              'set -- /packages/*.deb; test "$#" -eq 1; sh /smoke_deb.sh "$1"'
            echo "::endgroup::"
          done
      - name: Sign and verify the tested package with OpenSSL
        shell: bash
        env:
          DEB_SIGNING_KEY: ${{ secrets.DEB_SIGNING_KEY }}
          DEB_SIGNING_PASSWORD: ${{ secrets.DEB_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEB_SIGNING_KEY" || -z "$DEB_SIGNING_PASSWORD" ]]; then
            echo 'Missing DEB_SIGNING_KEY or DEB_SIGNING_PASSWORD repository secret.' >&2
            exit 1
          fi
          (cd dist && sha256sum -c ./*.deb.sha256)
          packages=(dist/*.deb)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/ae5ctl-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$DEB_SIGNING_KEY" > "$signing_dir/private.pem"
          printf '%s' "$DEB_SIGNING_PASSWORD" > "$signing_dir/password"
          unset DEB_SIGNING_KEY DEB_SIGNING_PASSWORD
          /usr/bin/python3 packaging/sign_deb.py "${packages[0]}" \
            --key "$signing_dir/private.pem" \
            --passphrase-file "$signing_dir/password" \
            --public-key-output dist/signing-public.pem
      - name: Publish only after every signed asset has been uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages=(dist/*.deb)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          package=${packages[0]}
          version=$(dpkg-deb --field "$package" Version)
          tag="$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/ae5ctl-release-notes.md"
          printf 'Tagged release of commit `%s`.\n\n' "$GITHUB_SHA" > "$notes"
          printf 'Includes the tested Debian package, SHA-256 checksum, OpenSSL signature and public key.\n' >> "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ae5ctl $version" \
            --notes-file "$notes" --draft --prerelease
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "$package" "$package.sha256" "$package.sig" dist/signing-public.pem
          download_dir=$(mktemp -d "$RUNNER_TEMP/ae5ctl-download.XXXXXX")
          trap 'rm -rf -- "$download_dir"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$download_dir"
          for asset in "$package" "$package.sha256" "$package.sig" dist/signing-public.pem; do
            cmp -- "$asset" "$download_dir/${asset##*/}"
          done
          (cd "$download_dir" && sha256sum -c ./*.deb.sha256)
          openssl dgst -sha256 -verify "$download_dir/signing-public.pem" \
            -signature "$download_dir/${package##*/}.sig" \
            "$download_dir/${package##*/}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
