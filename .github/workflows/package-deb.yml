name: Debian package

on:
  push:
    tags:
      - "deb-*"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the encrypted OpenSSL key in repository secrets
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build package without root or network
        run: /usr/bin/python3 packaging/build_deb.py
      - name: Test install and removal on Ubuntu LTS
        shell: bash
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm \
              --mount "type=bind,src=$PWD/dist,dst=/packages,readonly" \
              --mount "type=bind,src=$PWD/packaging/smoke_deb.sh,dst=/smoke_deb.sh,readonly" \
              "$image" sh -ec 'set -- /packages/*.deb; test "$#" -eq 1; sh /smoke_deb.sh "$1"'
          done
      - name: Sign and verify with OpenSSL
        if: ${{ github.event_name == 'push' || inputs.sign }}
        shell: bash
        env:
          DEB_SIGNING_KEY: ${{ secrets.DEB_SIGNING_KEY }}
          DEB_SIGNING_PASSWORD: ${{ secrets.DEB_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEB_SIGNING_KEY" || -z "$DEB_SIGNING_PASSWORD" ]]; then
            echo 'Configure DEB_SIGNING_KEY and DEB_SIGNING_PASSWORD to request signing.' >&2
            exit 1
          fi
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/ae5ctl-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$DEB_SIGNING_KEY" > "$signing_dir/private.pem"
          printf '%s' "$DEB_SIGNING_PASSWORD" > "$signing_dir/password"
          unset DEB_SIGNING_KEY DEB_SIGNING_PASSWORD
          for package in dist/*.deb; do
            /usr/bin/python3 packaging/sign_deb.py "$package" \
              --key "$signing_dir/private.pem" \
              --passphrase-file "$signing_dir/password" \
              --public-key-output dist/signing-public.pem
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ae5ctl-deb
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.deb.sig
            dist/signing-public.pem
